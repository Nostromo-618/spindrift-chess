<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spindrift Chess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Modern browser chess vs the Spindrift Engine with 6 difficulty levels. UI by vd3."
    />
    <link rel="canonical" href="https://spindriftchess.online/" />

    <!-- Phosphor Icons (Bold) — weight used for app chrome; served as a static asset -->
    <link rel="stylesheet" href="%BASE_URL%icons/phosphor/bold/style.css" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />

    <!-- Apply the persisted theme before first paint to avoid a flash of the wrong theme.
       Matches vd3's sdc-theme-preference key (storagePrefix "sdc-"); sdc-theme is the
       legacy app-owned parallel key. -->
    <script>
      (function () {
        try {
          var p =
            localStorage.getItem("sdc-theme-preference") || localStorage.getItem("sdc-theme");
          if (p === "light" || p === "dark") {
            document.documentElement.setAttribute("data-theme", p);
          }
        } catch (e) {
          /* private mode / storage disabled — fall back to system */
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
