name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck / lint / format
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run format:check
      - name: Unit + coverage + baseline
        run: |
          pnpm run test:coverage
          pnpm run test:baseline
      - name: Self-play gate
        env:
          SPINDRIFT_SELFPLAY_GAMES: "2"
          SPINDRIFT_SELFPLAY_MOVETIME: "150"
          SPINDRIFT_SELFPLAY_JOBS: "6"
        run: pnpm run test:selfplay
      - name: Playwright quick
        run: pnpm run test:e2e:quick
